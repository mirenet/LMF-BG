<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>LockScreen</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        background-color: #000000;
        font-family: Inter, Arial, sans-serif;
        color: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: env(safe-area-inset-top, 40px) 20px env(safe-area-inset-bottom, 40px) 20px;
        box-sizing: border-box;
        user-select: none;
        overflow: hidden;
        opacity: 0;
        transition: opacity 0.3s ease-in-out;
    }

    body.visible {
        opacity: 1;
    }

    .top-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 20px;
        gap: 15px;
    }

    .lock-icon {
        width: 24px;
        height: 24px;
        fill: #dadada;
    }

    .clock {
        font-size: 48px;
        font-weight: 300;
        letter-spacing: 1px;
        color: #f0f0f0;
    }

    .middle-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    .app-icon {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        object-fit: contain;
        box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .bottom-section {
        margin-bottom: 20px;
        text-align: center;
    }

    .swipe-text {
        font-size: 14px;
        color: #888888;
        letter-spacing: 0.5px;
        animation: pulseText 2s infinite ease-in-out;
    }

    @keyframes pulseText {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
    }
</style>
</head>
<body>

    <div class="top-section">
        <svg class="lock-icon" viewBox="0 0 24 24">
            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
        </svg>
        <div class="clock" id="clock">12:00</div>
    </div>

    <div class="middle-section">
        <img src="icon.png" alt="App Icon" class="app-icon" id="appIcon">
    </div>

    <div class="bottom-section">
        <div class="swipe-text">Swipe up to unlock</div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            minutes = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('clock').innerText = hours + ':' + minutes;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
